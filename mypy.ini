[mypy]
# Sprint 6: Advanced Type System Implementation - Progressive Strictness Configuration

# Python version and basic settings
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true

# Phase 1: Baseline Configuration (Current)
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false

# Import resolution
ignore_missing_imports = true
follow_imports = silent

# Error handling
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Strictness progression targets (to be enabled incrementally)
# Phase 2 targets:
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# disallow_untyped_calls = true

# Phase 3 targets (strict mode):
# strict = true
# disallow_any_generics = true
# disallow_subclassing_any = true
# disallow_any_unimported = true

# File-specific configurations for modernized modules
[mypy-quantipy.core.stack]
disallow_untyped_defs = true
warn_return_any = true

[mypy-quantipy.core.view]
disallow_untyped_defs = true
warn_return_any = true

[mypy-quantipy.core.tools.view.query]
disallow_untyped_defs = true
warn_return_any = true

# Future enhancement targets
[mypy-quantipy.core.chain]
# Target for Phase 2 - many type issues identified
warn_return_any = true

[mypy-quantipy.core.batch]
# Target for Phase 2 - complex type relationships
warn_return_any = true

[mypy-quantipy.core.weights.weight_engine]
# Target for Phase 2 - statistical processing types
warn_return_any = true