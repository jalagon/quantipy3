[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantipy3"
version = "0.3.0"
description = "Python 3 port of Quantipy - survey data processing, analysis and reporting with modern Python 3.10+ features"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["survey", "research", "data", "analysis", "quantipy"]
authors = [
    {name = "Quantipy Team", email = "quantipy@datasmoothie.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent", 
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0.0,<2.4.0",  # Updated to modern pandas
    "numpy>=2.0.0,<3.0.0",   # Updated to modern numpy
    "scipy>=1.10.0,<2.0.0",  # Updated for Python 3.10+ compatibility
    "pyreadstat>=1.3.0",     # Updated for savReaderWriter replacement
    "ftfy>=6.0.0",
    "requests>=2.28.0",
    "xlsxwriter>=3.0.0",
    "python-pptx>=0.6.21",
    "lxml>=4.9.0",           # Added explicit dependency
    "decorator>=5.0.0"       # Added explicit dependency
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",         # Updated to modern pytest
    "pytest-cov>=6.0.0",     # Updated coverage plugin
    "mypy>=1.17.0",          # Updated to latest mypy
    "ruff>=0.12.0",          # Updated to modern ruff
    "black>=25.0.0",         # Updated to latest black
    "isort>=6.0.0",          # Updated isort
    "pandas-stubs>=2.3.0",   # Added type stubs
    "types-requests>=2.32.0", # Added type stubs
    "types-decorator>=5.2.0", # Added type stubs
    "coverage>=7.0.0"        # Added explicit coverage
]
test = [
    "pytest>=8.0.0",         # Updated to modern pytest
    "pytest-cov>=6.0.0",     # Updated coverage plugin
    "pytest-xdist>=3.0.0"    # Parallel testing
]

[project.urls]
Homepage = "https://github.com/Quantipy/quantipy3"
Repository = "https://github.com/Quantipy/quantipy3.git"
Documentation = "https://quantipy.readthedocs.io"
Issues = "https://github.com/Quantipy/quantipy3/issues"

# Legacy Black configuration (maintained for compatibility)
[tool.black]
target-version = ["py310"]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
py_version = 310
line_length = 88

# Modern Ruff Configuration - Sprint 5 CI/CD Enhancement
[tool.ruff]
line-length = 88
target-version = "py310"
show-fixes = true
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors  
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade rules (Python 3.10+ syntax)
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear (bug detection)
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie (misc lints)
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "C90", # mccabe complexity checking
    "PL",  # pylint rules
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "RET504", # Unnecessary variable assignment before return statement
    "SIM118", # Use dict.keys() directly instead of dict.keys() iteration
    "PLR2004", # Magic value used in comparison
    "PLR0913", # Too many arguments in function definition
    "S101",   # Use of assert detected (common in tests)
    "S311",   # Standard pseudo-random generators (acceptable for non-crypto)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "S101", "PLR2004"]  # Allow test conventions
"__init__.py" = ["F401", "F403"]                 # Allow re-exports
"quantipy/core/tools/dp/spss/*" = ["S301"]       # Allow pickle usage in SPSS tools

[tool.ruff.lint.mccabe]
max-complexity = 12  # Moderate complexity threshold

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# MyPy Configuration - Sprint 5 Enhanced Type Checking
[tool.mypy]
python_version = "3.10"
# Progressive strictness - start moderate, move to strict
disallow_untyped_defs = false
disallow_incomplete_defs = false  
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true

# Enhanced modules get stricter checking
[[tool.mypy.overrides]]
module = [
    "quantipy.core.stack", 
    "quantipy.core.rules", 
    "quantipy.core.cluster", 
    "quantipy.core.weights.rim",
    "quantipy.core.cache", 
    "quantipy.core.options", 
    "quantipy.core.chain", 
    "quantipy.core.tools.dp.query",
    "quantipy.core.weights.weight_engine"
]
disallow_untyped_defs = true
check_untyped_defs = true

# Ignore missing imports for external packages
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*", 
    "scipy.*",
    "pyreadstat.*",
    "ftfy.*",
    "lxml.*"
]
ignore_missing_imports = true

# Pytest Configuration with Coverage
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--cov=quantipy --cov-fail-under=80 --cov-report=term-missing --cov-report=html"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["quantipy"]
omit = [
    "*/tests/*", 
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit Security Configuration
[tool.bandit]
exclude_dirs = ["tests", "docs", "build"]
tests = ["B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308", "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316", "B317", "B318", "B319", "B320", "B321", "B322", "B323", "B324", "B325", "B401", "B402", "B403", "B404", "B405", "B406", "B407", "B408", "B409", "B410", "B411", "B412", "B413", "B501", "B502", "B503", "B504", "B505", "B506", "B507", "B601", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611", "B701", "B702", "B703"]
skips = ["B101", "B601"]  # Skip assert_used and shell injection for specific cases

[tool.bandit.assert_used]
exclude = ["*/tests/*"]

# Development and Build Tools Configuration
[tool.setuptools_scm]
write_to = "quantipy/_version.py"
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

# Wheel building configuration  
[tool.wheel]
universal = false

# Additional development tool configurations for modern Python
[tool.codespell]
skip = "*.po,*.ts,*.js,*.map,*.lock"
ignore-words-list = "quantipy,datasmoothie,xlsx"